<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Management
        </a>
        <div class="ms-auto d-flex align-items-center">
            <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom">
                    <h4 class="mb-0 fw-bold text-primary" th:text="${pageTitle}">Student Form</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>

                    <form th:action="@{/students}" th:object="${student}" method="post">
                        <!-- Hidden ID if editing -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3">
                            <!-- Student Code -->
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label fw-semibold">Student ID / Roll No <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{studentCode}" class="form-control" id="studentCode" placeholder="e.g. CS2026-004" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></div>
                            </div>

                            <!-- Full Name -->
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="e.g. Sneha Kulkarni" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="sneha@college.edu" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Department -->
                            <div class="col-md-6">
                                <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <select th:field="*{department}" class="form-select" id="department" required>
                                    <option value="" disabled selected>-- Select Department --</option>
                                    <option value="Computer Engineering">Computer Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Artificial Intelligence & DS">Artificial Intelligence & DS</option>
                                    <option value="Electronics & Telecomm">Electronics & Telecomm</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                    <option value="Civil Engineering">Civil Engineering</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                            </div>

                            <!-- Academic Year / Semester -->
                            <div class="col-md-6">
                                <label for="academicYear" class="form-label fw-semibold">Academic Year / Semester <span class="text-danger">*</span></label>
                                <select th:field="*{academicYear}" class="form-select" id="academicYear" required>
                                    <option value="" disabled selected>-- Select Year / Semester --</option>
                                    <option value="First Year (Sem 1-2)">First Year (Sem 1-2)</option>
                                    <option value="Second Year (Sem 3-4)">Second Year (Sem 3-4)</option>
                                    <option value="Third Year (Sem 5-6)">Third Year (Sem 5-6)</option>
                                    <option value="Final Year (Sem 7-8)">Final Year (Sem 7-8)</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('academicYear')}" th:errors="*{academicYear}"></div>
                            </div>

                            <!-- Contact Number -->
                            <div class="col-md-6">
                                <label for="contactNumber" class="form-label fw-semibold">Contact Number (10 digits)</label>
                                <input type="text" th:field="*{contactNumber}" class="form-control" id="contactNumber" placeholder="9876543210">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Save Student Record
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
