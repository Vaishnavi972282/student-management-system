<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background: #0d6efd;
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="login-card mx-auto">
        <div class="login-header">
            <i class="bi bi-mortarboard-fill display-4"></i>
            <h3 class="mt-2 mb-0 fw-bold">Student Portal</h3>
            <p class="small text-light mb-0">DevOps Student Management Application</p>
        </div>
        <div class="p-4">
            <!-- Alert Messages -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid email or password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> You have logged out successfully.
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> Account created successfully! Please sign in.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="username" name="username" placeholder="name@college.edu" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="mt-4 pt-2 text-center border-top">
                <p class="small text-muted mb-2">New student or administrator?</p>
                <a th:href="@{/register}" class="btn btn-outline-secondary btn-sm w-100">
                    <i class="bi bi-person-plus me-1"></i> Create New Account
                </a>
            </div>

            <div class="mt-3 p-2 bg-light rounded text-center small text-secondary">
                <strong>Demo Credentials:</strong><br>
                Email: <code>admin@college.edu</code> | Pass: <code>admin123</code>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
